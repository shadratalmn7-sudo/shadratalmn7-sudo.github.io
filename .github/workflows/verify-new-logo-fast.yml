name: verify-new-logo-fast

on:
  push:
    paths:
      - '.github/workflows/verify-new-logo-fast.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Public HTML must reference only new logo
        run: |
          set -euo pipefail
          html="$(curl -LfsS 'https://shadratalmn7-sudo.github.io/?new-logo-final=1')"
          printf '%s' "$html" | grep -Fq 'assets/shazarat-logo-blue.png?v=20260905b'
          if printf '%s' "$html" | grep -Fq 'assets/shazarat-logo.svg'; then exit 1; fi
      - run: python3 -m pip install --quiet selenium
      - name: Chrome laptop and mobile
        shell: bash
        run: |
          python3 - <<'PY'
          import json,time
          from selenium import webdriver
          from selenium.webdriver.common.by import By
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.support.ui import WebDriverWait
          from selenium.common.exceptions import TimeoutException
          out=[]
          for name,w,h in [('laptop',1440,900),('mobile',390,844)]:
              o=Options(); o.page_load_strategy='eager'; o.add_argument('--headless=new'); o.add_argument('--no-sandbox'); o.add_argument('--disable-dev-shm-usage'); o.add_argument(f'--window-size={w},{h}')
              d=webdriver.Chrome(options=o); d.set_page_load_timeout(20)
              try:
                  try: d.get('https://shadratalmn7-sudo.github.io/?new-logo-chrome='+str(int(time.time()*1000)))
                  except TimeoutException: d.execute_script('window.stop()')
                  img=WebDriverWait(d,15).until(lambda x:x.find_element(By.CSS_SELECTOR,'.site-header .brand-logo'))
                  WebDriverWait(d,15).until(lambda x:x.execute_script('return arguments[0].complete && arguments[0].naturalWidth>0',img))
                  src=img.get_attribute('src') or ''
                  assert 'shazarat-logo-blue.png' in src and 'shazarat-logo.svg' not in src, src
                  assert img.is_displayed(), 'logo hidden'
                  resources=d.execute_script("return performance.getEntriesByType('resource').map(e=>e.name)")
                  old=[r for r in resources if 'shazarat-logo.svg' in r]
                  assert not old, old
                  d.save_screenshot(f'new-logo-{name}.png')
                  out.append({'viewport':name,'src':src,'displayed':True,'rect':img.rect,'oldLogoRequests':old})
              finally: d.quit()
          open('new-logo-report.json','w').write(json.dumps(out,ensure_ascii=False,indent=2))
          print(json.dumps(out,ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: new-logo-fast-proof
          path: |
            new-logo-laptop.png
            new-logo-mobile.png
            new-logo-report.json
