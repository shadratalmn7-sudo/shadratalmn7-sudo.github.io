name: bump-logo-css-cache
on:
  push:
    paths:
      - '.github/workflows/bump-logo-css-cache.yml'
jobs:
  bump:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Bump nav CSS version everywhere
        run: |
          python3 - <<'PY'
          from pathlib import Path
          changed=[]
          for p in Path('.').rglob('*.html'):
              s=p.read_text(encoding='utf-8')
              ns=s.replace('nav-universal.css?v=158','nav-universal.css?v=159')
              if ns!=s:
                  p.write_text(ns,encoding='utf-8')
                  changed.append(str(p))
          print('changed', len(changed))
          print('\n'.join(changed))
          PY
      - name: Commit cache bump
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'shadratalmn7-sudo'
          git config user.email 'shadrat.almn7@gmail.com'
          git add '*.html' '**/*.html' || true
          git commit -m 'Bust cache for larger Shadrat logo'
          git push