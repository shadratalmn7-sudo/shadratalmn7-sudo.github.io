name: bump-logo-css-cache
on:
  push:
    paths:
      - '.github/workflows/bump-logo-css-cache.yml'
      - 'nav-universal.css'
      - 'nav-universal.js'
      - 'notifications-live.js'
      - 'scholarship-auto-alerts.js'
      - 'service-auto-alerts.js'
      - 'push-notifications.js'
      - 'admin-commerce.js'
      - 'level-system.js'
      - 'profile-core.js'
      - 'profile-edit-deep.js'
      - 'profile-settings.js'
      - 'profile-art-themes.css'
      - 'assets/profile-themes/**'
jobs:
  bump:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Verify notification scripts parse
        run: |
          node --check notifications-live.js
          node --check scholarship-auto-alerts.js
          node --check service-auto-alerts.js
          node --check push-notifications.js
          node --check admin-commerce.js
      - name: Bust changed front-end asset caches
        run: |
          python3 - <<'PY'
          from pathlib import Path
          changed=[]
          for p in list(Path('.').rglob('*.html')) + list(Path('.').rglob('*.js')):
              s=p.read_text(encoding='utf-8')
              ns=s
              ns=ns.replace('nav-universal.css?v=159','nav-universal.css?v=160')
              ns=ns.replace('./level-system.js?v=2','./level-system.js?v=5')
              ns=ns.replace('./level-system.js?v=3','./level-system.js?v=5')
              ns=ns.replace('./level-system.js?v=4','./level-system.js?v=5')
              ns=ns.replace('profile-core.js?v=12','profile-core.js?v=16')
              ns=ns.replace('profile-core.js?v=13','profile-core.js?v=16')
              ns=ns.replace('profile-core.js?v=14','profile-core.js?v=16')
              ns=ns.replace('profile-core.js?v=15','profile-core.js?v=16')
              ns=ns.replace('profile-gamification-live.js?v=10','profile-gamification-live.js?v=12')
              ns=ns.replace('profile-gamification-live.js?v=11','profile-gamification-live.js?v=12')
              ns=ns.replace('profile-settings.js?v=1','profile-settings.js?v=3')
              ns=ns.replace('profile-settings.js?v=2','profile-settings.js?v=3')
              ns=ns.replace('profile-edit-deep.js?v=5','profile-edit-deep.js?v=7')
              ns=ns.replace('profile-edit-deep.js?v=6','profile-edit-deep.js?v=7')
              ns=ns.replace("./profile-edit-deep.js?v=2","./profile-edit-deep.js?v=7")
              ns=ns.replace('profile-art-themes.css?v=3','profile-art-themes.css?v=6')
              ns=ns.replace('profile-art-themes.css?v=4','profile-art-themes.css?v=6')
              ns=ns.replace('profile-art-themes.css?v=5','profile-art-themes.css?v=6')
              ns=ns.replace('student-profile.js?v=4','student-profile.js?v=5')
              for v in range(153,162):
                  ns=ns.replace(f'nav-universal.js?v={v}','nav-universal.js?v=162')
              ns=ns.replace("./notifications-live.js?v=12","./notifications-live.js?v=16")
              ns=ns.replace("./notifications-live.js?v=13","./notifications-live.js?v=16")
              ns=ns.replace("./notifications-live.js?v=14","./notifications-live.js?v=16")
              ns=ns.replace("./notifications-live.js?v=15","./notifications-live.js?v=16")
              ns=ns.replace("./push-notifications.js?v=3","./push-notifications.js?v=6")
              ns=ns.replace("./push-notifications.js?v=4","./push-notifications.js?v=6")
              ns=ns.replace("./push-notifications.js?v=5","./push-notifications.js?v=6")
              ns=ns.replace("load('./push-notifications.js?v=4','web push');","load('./push-notifications.js?v=6','web push');")
              ns=ns.replace("load('./push-notifications.js?v=5','web push');","load('./push-notifications.js?v=6','web push');")
              ns=ns.replace("'admin-services.html':'./admin-commerce.js?v=21'","'admin-services.html':'./admin-commerce.js?v=22'")
              ns=ns.replace("'admin-offers.html':'./admin-commerce.js?v=21'","'admin-offers.html':'./admin-commerce.js?v=22'")
              ns=ns.replace("const publicModules=async()=>{\n    const routes={","const publicModules=async()=>{\n    load('./push-notifications.js?v=6','web push');\n    const routes={")
              ns=ns.replace("const required=[d.username,d.age,d.nationality,d.currentCountry||d.country,d.city,d.studyLevel,d.contactValue]","const required=[d.username,d.age,d.nationality,d.currentCountry||d.country,d.city,d.studyLevel,d.contactMethod,d.contactValue]")
              old='<button class="profile-cover-edit" type="button" data-profile-edit aria-label="تعديل حسابي" title="تعديل حسابي"><svg viewBox="0 0 24 24" fill="none"><path d="M4.5 19.5 8 18.8 18.2 8.6a2.2 2.2 0 0 0-3.1-3.1L4.9 15.7l-.4 3.8ZM13.8 6.8l3.4 3.4"/></svg></button>'
              new='<a class="profile-cover-edit" href="profile-settings.html" aria-label="تعديل حسابي" title="تعديل حسابي"><svg viewBox="0 0 24 24" fill="none"><path d="M4.5 19.5 8 18.8 18.2 8.6a2.2 2.2 0 0 0-3.1-3.1L4.9 15.7l-.4 3.8ZM13.8 6.8l3.4 3.4"/></svg></a>'
              ns=ns.replace(old,new)
              ns=ns.replace('<a class="profile-cover-edit" href="profile-settings.html" data-profile-edit aria-label="تعديل حسابي" title="تعديل حسابي">','<a class="profile-cover-edit" href="profile-settings.html" aria-label="تعديل حسابي" title="تعديل حسابي">')
              if ns!=s:
                  p.write_text(ns,encoding='utf-8')
                  changed.append(str(p))
          print('changed', len(changed))
          print('\n'.join(changed))
          PY
      - name: Commit cache bump
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'shadratalmn7-sudo'
          git config user.email 'shadrat.almn7@gmail.com'
          git add -A
          git commit -m 'Bump notification and service alert caches'
          git push
