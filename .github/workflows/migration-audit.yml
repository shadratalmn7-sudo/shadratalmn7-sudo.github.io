name: Migration Audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/migration-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify critical files
        run: |
          test -f index.html
          test -f login.html
          test -f register.html
          test -f auth.js
          test -f auth-enhanced.css
          test -f scholarships.html
          test -f scholarships-live.js
          test -f scholarship.html
          test -f scholarship-detail.js
          test -f scholarships-enhanced.css
          test -f contact-live.js
          test -f admin-messages.js
          test -f student-support.js
          test -f firestore.rules
          test -f admin-access.js
      - name: Check requested features
        run: |
          grep -q 'data-google-auth' login.html
          grep -q 'data-google-auth' register.html
          grep -q 'signInWithPopup' auth.js
          grep -q 'browserLocalPersistence' auth.js
          grep -q 'أنشئ حسابًا من هنا' login.html
          grep -q 'سجل الدخول من هنا' register.html
          grep -q 'data-country="روسيا"' scholarships.html
          grep -q 'data-country="المجر"' scholarships.html
          grep -q 'data-country="تركيا"' scholarships.html
          grep -q "collection(db,'messages')" contact-live.js
          grep -q "collection(db,'messages')" admin-messages.js
          grep -q 'adminReply' student-support.js
          grep -q "match /messages/{messageId}" firestore.rules
          grep -q "request.resource.data.status == 'new'" firestore.rules
      - name: Check internal HTML references
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          from urllib.parse import urlsplit, unquote
          bad=[]
          class P(HTMLParser):
              def __init__(self,page): super().__init__(); self.page=page
              def handle_starttag(self,tag,attrs):
                  d=dict(attrs)
                  for key in ('href','src'):
                      u=d.get(key)
                      if not u or u.startswith(('#','http://','https://','mailto:','tel:','data:','javascript:')): continue
                      path=unquote(urlsplit(u).path)
                      if not path: continue
                      target=self.page.parent/path
                      if path.endswith('/'): target=target/'index.html'
                      if not target.exists(): bad.append((str(self.page),u))
          for page in Path('.').glob('*.html'):
              P(page).feed(page.read_text(encoding='utf-8'))
          if bad:
              print(bad); raise SystemExit(1)
          print('Internal references OK')
          PY
      - name: Audit marker
        run: echo 'auth scholarship support audit 2026-08-18'
