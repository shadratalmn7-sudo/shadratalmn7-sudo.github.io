name: Copy Missing Source Files

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/copy-missing-source.yml'

permissions:
  contents: write

jobs:
  copy-missing:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch source repository
        run: |
          git clone --depth 1 https://github.com/shadratalmn7-sudo/shazarat-platform.git /tmp/shazarat-source
      - name: Copy only files missing from target
        run: |
          rsync -a --ignore-existing \
            --exclude='.git/' \
            --exclude='.github/' \
            /tmp/shazarat-source/ ./
      - name: Commit copied files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No missing files"
          else
            git commit -m "Copy remaining Shazarat source files [skip ci]"
            git push
          fi
