name: remove-hilltopads-multitag
on:
  push:
    paths:
      - '.github/workflows/install-hilltopads.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove HilltopAds MultiTag from all public pages
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          pattern = re.compile(
              r'<script>\s*\(function\(aduq\)\{.*?untimely-hello\.com.*?</script>\s*',
              re.S,
          )

          changed = []
          for p in Path('.').glob('*.html'):
              s = p.read_text(encoding='utf-8')
              ns, count = pattern.subn('', s)
              if count:
                  p.write_text(ns, encoding='utf-8')
                  changed.append(p.name)

          print(f'Removed HilltopAds MultiTag from {len(changed)} pages')
          print('\n'.join(changed))
          PY
      - name: Commit cleanup
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'shadratalmn7-sudo'
          git config user.email 'shadrat.almn7@gmail.com'
          git add '*.html'
          git commit -m 'Remove aggressive HilltopAds MultiTag popups'
          git push
