name: verify-new-logo-live

on:
  push:
    paths:
      - '.github/workflows/verify-new-logo-live.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Confirm public HTML uses only new logo source
        shell: bash
        run: |
          set -euo pipefail
          URL='https://shadratalmn7-sudo.github.io/'
          ok=0
          for i in $(seq 1 36); do
            html="$(curl -LfsS "${URL}?final-logo-check=${GITHUB_SHA}-${i}" || true)"
            if printf '%s' "$html" | grep -Fq 'assets/shazarat-logo-blue.png?v=20260905b' && ! printf '%s' "$html" | grep -Fq 'assets/shazarat-logo.svg'; then
              ok=1
              break
            fi
            sleep 5
          done
          test "$ok" = 1

      - name: Install Selenium
        run: python3 -m pip install --quiet selenium

      - name: Open public site in Chrome laptop and mobile and reject any old-logo request
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,time
          from selenium import webdriver
          from selenium.webdriver.common.by import By
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.support.ui import WebDriverWait

          report=[]
          for name,w,h in [('laptop',1440,900),('mobile',390,844)]:
              o=Options(); o.add_argument('--headless=new'); o.add_argument('--no-sandbox'); o.add_argument('--disable-dev-shm-usage'); o.add_argument(f'--window-size={w},{h}')
              d=webdriver.Chrome(options=o)
              try:
                  d.get('https://shadratalmn7-sudo.github.io/?final-logo='+str(int(time.time()*1000)))
                  WebDriverWait(d,25).until(lambda x:x.execute_script('return document.readyState')=='complete')
                  imgs=d.find_elements(By.CSS_SELECTOR,'.brand-logo,.footer-logo')
                  assert imgs, f'{name}: no logo elements'
                  checked=[]
                  for img in imgs:
                      WebDriverWait(d,25).until(lambda x,el=img:x.execute_script('return arguments[0].complete && arguments[0].naturalWidth>0',el))
                      src=img.get_attribute('src') or ''
                      assert 'shazarat-logo-blue.png' in src, f'{name}: wrong logo src {src}'
                      assert 'shazarat-logo.svg' not in src, f'{name}: old logo still in DOM {src}'
                      checked.append({'src':src,'displayed':img.is_displayed(),'rect':img.rect})
                  resources=d.execute_script("return performance.getEntriesByType('resource').map(e=>e.name)")
                  old=[r for r in resources if 'shazarat-logo.svg' in r]
                  assert not old, f'{name}: old logo requested {old}'
                  d.save_screenshot(f'final-{name}.png')
                  report.append({'viewport':name,'logos':checked,'oldLogoRequests':old})
              finally:
                  d.quit()
          open('final-logo-report.json','w',encoding='utf-8').write(json.dumps(report,ensure_ascii=False,indent=2))
          print(json.dumps(report,ensure_ascii=False))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: final-new-logo-proof
          path: |
            final-laptop.png
            final-mobile.png
            final-logo-report.json
          if-no-files-found: error
