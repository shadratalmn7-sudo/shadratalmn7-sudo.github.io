name: Activate New Homepage

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/activate-new-homepage.yml'

permissions:
  contents: write

jobs:
  activate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy current Shazarat homepage
        run: |
          curl -fL "https://raw.githubusercontent.com/shadratalmn7-sudo/shazarat-platform/main/index.html" -o index.html
      - name: Ensure AdSense verification is present
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          meta='<meta name="google-adsense-account" content="ca-pub-9420608712266016">'
          script='<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9420608712266016" crossorigin="anonymous"></script>'
          if 'google-adsense-account' not in s:
              s=s.replace('<head>','<head>'+meta,1)
          if 'pagead2.googlesyndication.com/pagead/js/adsbygoogle.js' not in s:
              s=s.replace('</head>',script+'</head>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit activated homepage
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "Homepage already active"
          else
            git commit -m "Activate migrated Shazarat homepage [skip ci]"
            git push
          fi
