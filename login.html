<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,follow"><meta name="referrer" content="no-referrer"><title>تسجيل الدخول | شذرات</title><link rel="stylesheet" href="auth-flow.css?v=1"></head><body><header class="auth-header"><a href="index.html" aria-label="شذرات للمنح"><img src="assets/shazarat-logo-blue.png?v=20260905b" alt="شذرات للمنح"></a><a href="index.html">العودة للموقع</a></header><main class="auth-shell"><section class="auth-card"><h1>تسجيل الدخول</h1><p class="intro">كل منحك وطلباتك وملفاتك في حساب واحد.</p><button class="google-btn" type="button" data-google-auth="login"><span aria-hidden="true" class="google-g">G</span>المتابعة باستخدام Google</button><div class="auth-divider">أو بالبريد الإلكتروني</div><form id="login-form"><div class="field"><label for="email">البريد الإلكتروني</label><input id="email" name="email" type="email" required autocomplete="username" dir="ltr" placeholder="name@example.com"></div><div class="field"><label for="password">كلمة المرور</label><div class="password-field"><input id="password" name="password" type="password" required  autocomplete="current-password"><button type="button" data-toggle-password="password" aria-label="إظهار كلمة المرور" aria-pressed="false">إظهار</button></div></div><a class="auth-reset" href="forgot-password.html" data-auth-route>نسيت كلمة المرور؟</a><button class="auth-submit" type="submit">تسجيل الدخول</button><p data-auth-message class="auth-message" role="status" aria-live="polite"></p><button type="button" id="resend-verification" class="text-button" hidden>إعادة إرسال رسالة تأكيد البريد</button></form><p class="auth-switch">جديد على شذرات؟ <a href="register.html" data-auth-route>إنشاء حساب</a></p><details><summary>سجلت باستخدام Google؟</summary><p>ادخل بزر Google. وإذا أردت استخدام البريد وكلمة مرور أيضًا، أضف كلمة مرور إلى حسابك نفسه.</p><a href="set-password.html" data-auth-route>إضافة كلمة مرور لحساب Google</a></details></section></main><script type="module" src="registration-event-reporter.js?v=1"></script><script type="module" src="public-profile-bootstrap.js?v=1"></script><script type="module" src="auth.js?v=27"></script></body></html>
