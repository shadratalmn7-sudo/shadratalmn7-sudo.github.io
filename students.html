<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>طلاب شذرات | شذرات للمنح</title><meta name="robots" content="noindex,nofollow"><link rel="stylesheet" href="site.css?v=31"><link rel="stylesheet" href="site-polish.css?v=1"><link rel="stylesheet" href="nav-universal.css?v=160"><style>body{background:#f5f8fc}.students-shell{width:min(1050px,100%);margin:auto;padding:20px 14px 44px}.students-head{display:flex;align-items:end;justify-content:space-between;gap:14px;margin:8px 0 18px}.students-head h1{margin:0;font-size:28px;color:#173d75}.students-head p{margin:6px 0 0;color:#64748b}.students-search{width:min(360px,100%);min-height:48px;border:1px solid #cedbec;border-radius:14px;padding:10px 13px;font:inherit;background:#fff}.students-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}.student-card{display:block;padding:16px;border:1px solid #dbe6f2;border-radius:20px;background:#fff;text-decoration:none;color:inherit;box-shadow:0 7px 24px rgba(15,23,42,.045)}.student-card:hover{border-color:#b9d2f4}.student-card-top{display:flex;gap:12px;align-items:center}.student-card-avatar{width:58px;height:58px;flex:0 0 58px;border-radius:18px;background:#e8f1ff;display:grid;place-items:center;overflow:hidden;color:#1d5fd0;font-weight:900;font-size:22px}.student-card-avatar img{width:100%;height:100%;object-fit:cover}.student-card h2{margin:0;font-size:17px}.student-card .username{margin:3px 0 0;color:#4d6f9d;font-size:12px;font-weight:900}.student-card .bio{margin:12px 0 0;color:#566982;font-size:13px;line-height:1.7;min-height:44px}.student-meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:11px}.student-meta span{padding:5px 8px;border-radius:999px;background:#f2f7ff;border:1px solid #dce9f8;color:#335b8d;font-size:11px;font-weight:800}.students-status{padding:22px;text-align:center;color:#64748b}.students-note{margin-top:18px;padding:12px 14px;border:1px solid #d9e6f6;border-radius:14px;background:#f8fbff;color:#5b6f8c;font-size:12px;line-height:1.8}@media(max-width:850px){.students-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:620px){.students-head{align-items:stretch;flex-direction:column}.students-grid{grid-template-columns:1fr}.students-search{width:100%}}</style><meta name="referrer" content="no-referrer-when-downgrade">
