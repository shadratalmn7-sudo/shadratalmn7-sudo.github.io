<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,follow"><meta name="referrer" content="no-referrer"><title>استعادة كلمة المرور | شذرات</title><link rel="stylesheet" href="auth-flow.css?v=1"></head><body><header class="auth-header"><a href="index.html" aria-label="شذرات للمنح"><img src="assets/shazarat-logo-blue.png?v=20260905b" alt="شذرات للمنح"></a><a href="index.html">العودة للموقع</a></header><main class="auth-shell"><section class="auth-card"><h1>استعادة كلمة المرور</h1><p class="intro">أدخل بريد حسابك وسنرسل إليه رابطًا آمنًا لاختيار كلمة مرور جديدة.</p><form id="reset-form"><div class="field"><label for="reset-email">البريد الإلكتروني</label><input id="reset-email" name="email" type="email" required autocomplete="email" dir="ltr" placeholder="name@example.com"></div><button class="auth-submit" type="submit">إرسال رابط الاستعادة</button><p data-auth-message class="auth-message" role="status" aria-live="polite"></p></form><p class="hint">افحص الوارد والرسائل غير المرغوبة. لا تشارك رابط الاستعادة مع أحد.</p><p class="auth-switch"><a href="login.html" data-auth-route>العودة لتسجيل الدخول</a></p></section></main><script type="module" src="auth.js?v=27"></script></body></html>
