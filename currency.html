<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>محول العملات | شذرات للمنح</title>
<meta name="description" content="محول عملات للطلاب يدعم العملات العربية والعالمية المشهورة مع تحديث تلقائي لسعر الصرف.">
<meta name="robots" content="index,follow"><link rel="canonical" href="https://shadratalmn7-sudo.github.io/currency.html"><link rel="icon" href="favicon-shadrat.svg" type="image/svg+xml">
<link rel="stylesheet" href="site.css?v=21"><link rel="stylesheet" href="site-polish.css?v=1"><link rel="stylesheet" href="logo.css?v=11"><link rel="stylesheet" href="nav-universal.css?v=131">
<style>
.currency-wrap{max-width:820px;margin:48px auto;padding:0 16px}.currency-card{background:#fff;border:1px solid #e8e2d8;border-radius:24px;padding:24px;box-shadow:0 12px 34px rgba(0,0,0,.06)}.currency-card h1{margin:0 0 8px}.currency-sub{color:#6a665f;margin:0 0 22px}.converter-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}.field{display:flex;flex-direction:column;gap:8px}.field label{font-weight:700}.field input,.field select{width:100%;box-sizing:border-box;padding:14px 16px;border:1px solid #d9d3c8;border-radius:14px;font:inherit;background:#fff}.swap-row{display:flex;justify-content:center;margin:12px 0}.swap{border:1px solid #d9d3c8;background:#fff;border-radius:999px;padding:8px 16px;font:inherit;cursor:pointer}.rate-box{margin-top:16px;padding:18px;border-radius:16px;background:#f6f2ea;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.rate-main{font-size:1.15rem;font-weight:800}.rate-meta,.status{font-size:.9rem;color:#716b61}.status{margin-top:10px}.quick{display:flex;gap:8px;overflow:auto;padding:14px 0 2px}.quick button{white-space:nowrap;border:1px solid #ded8cd;background:#fff;border-radius:999px;padding:8px 12px;cursor:pointer}.back-inline{display:inline-flex;margin-bottom:14px;text-decoration:none}.note{margin-top:16px;font-size:.88rem;color:#716b61;line-height:1.8}@media(max-width:700px){.converter-grid{grid-template-columns:1fr}.currency-card{padding:18px}.currency-wrap{margin:28px auto}}
</style>
</head><body>
<header class="site-header"><div class="container nav"><a class="brand" href="index.html"><img class="brand-logo" src="assets/shazarat-logo.svg" alt="شذرات للمنح"></a></div></header>
<main class="currency-wrap"><a class="back-inline" href="index.html">← العودة للرئيسية</a><section class="currency-card">
<span class="eyebrow">أداة للطلاب</span><h1>محول العملات</h1><p class="currency-sub">حوّل بين العملات العربية والعالمية المشهورة. أسعار الصرف تتحدث تلقائيًا.</p>
<div class="converter-grid">
<div class="field"><label for="amount">المبلغ</label><input id="amount" type="number" min="0" step="any" value="1000" inputmode="decimal"></div>
<div class="field"><label for="from">من</label><select id="from"></select></div>
<div class="field"><label for="to">إلى</label><select id="to"></select></div>
</div>
<div class="swap-row"><button class="swap" id="swap" type="button">⇄ تبديل العملات</button></div>
<div class="quick"><button data-pair="RUB,SAR">🇷🇺 RUB → 🇸🇦 SAR</button><button data-pair="USD,SAR">🇺🇸 USD → 🇸🇦 SAR</button><button data-pair="EUR,SAR">🇪🇺 EUR → 🇸🇦 SAR</button><button data-pair="USD,AED">🇺🇸 USD → 🇦🇪 AED</button><button data-pair="USD,EGP">🇺🇸 USD → 🇪🇬 EGP</button></div>
<div class="rate-box"><div><div class="rate-main" id="result">جاري تحديث السعر…</div><div class="rate-meta" id="rateText"></div></div><div class="rate-meta" id="updated"></div></div><div class="status" id="status">يتم جلب سعر الصرف تلقائيًا.</div>
<p class="note">الأسعار إرشادية وقد تختلف قليلًا عن سعر البنك أو شركة التحويل وقت تنفيذ العملية.</p>
</section></main><script src="nav-universal.js?v=131"></script>
<script>
(()=>{
const currencies=[
['SAR','🇸🇦','ريال سعودي'],['AED','🇦🇪','درهم إماراتي'],['KWD','🇰🇼','دينار كويتي'],['QAR','🇶🇦','ريال قطري'],['BHD','🇧🇭','دينار بحريني'],['OMR','🇴🇲','ريال عُماني'],['JOD','🇯🇴','دينار أردني'],['EGP','🇪🇬','جنيه مصري'],['IQD','🇮🇶','دينار عراقي'],['YER','🇾🇪','ريال يمني'],['MAD','🇲🇦','درهم مغربي'],['DZD','🇩🇿','دينار جزائري'],['TND','🇹🇳','دينار تونسي'],['LYD','🇱🇾','دينار ليبي'],['LBP','🇱🇧','ليرة لبنانية'],
['USD','🇺🇸','دولار أمريكي'],['EUR','🇪🇺','يورو'],['GBP','🇬🇧','جنيه إسترليني'],['RUB','🇷🇺','روبل روسي'],['TRY','🇹🇷','ليرة تركية'],['CNY','🇨🇳','يوان صيني'],['JPY','🇯🇵','ين ياباني'],['CAD','🇨🇦','دولار كندي'],['AUD','🇦🇺','دولار أسترالي'],['CHF','🇨🇭','فرنك سويسري'],['INR','🇮🇳','روبية هندية'],['KRW','🇰🇷','وون كوري جنوبي']];
const amount=document.getElementById('amount'),from=document.getElementById('from'),to=document.getElementById('to'),result=document.getElementById('result'),rateText=document.getElementById('rateText'),updated=document.getElementById('updated'),status=document.getElementById('status');
const map=Object.fromEntries(currencies.map(x=>[x[0],x])); currencies.forEach(([c,f,n])=>{from.add(new Option(`${f} ${n} (${c})`,c));to.add(new Option(`${f} ${n} (${c})`,c));}); from.value='RUB';to.value='SAR';
let rates={},base='',last=null;const nf=new Intl.NumberFormat('ar-SA',{maximumFractionDigits:2});const rf=new Intl.NumberFormat('ar-SA',{maximumFractionDigits:6});
function render(){const n=Number(amount.value||0);const r=Number(rates[to.value]);if(base!==from.value||!Number.isFinite(r)){load();return;}result.textContent=`${nf.format(n)} ${map[from.value][2]} ≈ ${nf.format(n*r)} ${map[to.value][2]}`;rateText.textContent=`1 ${from.value} ≈ ${rf.format(r)} ${to.value}`;if(last)updated.textContent=`آخر تحديث: ${last.toLocaleString('ar-SA')}`;}
async function load(){try{status.textContent='جاري تحديث سعر الصرف…';result.textContent='جاري الحساب…';const res=await fetch(`https://open.er-api.com/v6/latest/${from.value}`,{cache:'no-store'});if(!res.ok)throw 0;const data=await res.json();if(!data.rates||!data.rates[to.value])throw 0;rates=data.rates;base=from.value;last=new Date();status.textContent='تم تحديث السعر تلقائيًا.';render();}catch(e){status.textContent='تعذر جلب السعر حاليًا. حاول مرة أخرى بعد قليل.';result.textContent='السعر غير متاح مؤقتًا';}}
amount.addEventListener('input',()=>{if(base===from.value)render()});from.addEventListener('change',load);to.addEventListener('change',()=>{if(base===from.value&&rates[to.value])render();else load()});document.getElementById('swap').onclick=()=>{const x=from.value;from.value=to.value;to.value=x;load()};document.querySelectorAll('[data-pair]').forEach(b=>b.onclick=()=>{const [a,z]=b.dataset.pair.split(',');from.value=a;to.value=z;load()});load();setInterval(load,30*60*1000);
})();
</script></body></html>
