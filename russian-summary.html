et all=D.filter(x=>x.unit===u),gs={};all.forEach(x=>(gs[x.group]??=[]).push(x));let pick=[];Object.values(gs).forEach(a=>pick.push(...a.slice(0,Math.min(4,a.length))));pick=pick.slice(0,30);document.getElementById('lessonMeta').textContent=`${pick.length} مدخلًا مختارًا من أصل ${all.length}`;let out={};pick.forEach(x=>(out[x.group]??=[]).push(x));C.innerHTML=Object.entries(out).map(([g,a])=>`<section class="rb-group"><h3>${e(g)}</h3><div class="rb-words">${a.map(x=>`<div class="rb-word"><div class="rb-ru">${e(x.ru)}</div><div class="rb-ar">${e(x.ar)}</div><div class="rb-en">${e(x.en)}</div></div>`).join('')}</div></section>`).join('')}r()</script></body></html>
