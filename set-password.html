<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,follow"><meta name="referrer" content="no-referrer"><title>إضافة كلمة مرور | شذرات</title><link rel="stylesheet" href="auth-flow.css?v=1"></head><body><header class="auth-header"><a href="index.html" aria-label="شذرات للمنح"><img src="assets/shazarat-logo-blue.png?v=20260905b" alt="شذرات للمنح"></a><a href="index.html">العودة للموقع</a></header><main class="auth-shell"><section class="auth-card"><h1>إضافة كلمة مرور</h1><p class="intro">أكّد حسابك باستخدام Google، ثم أضف كلمة مرور خاصة بشذرات. ستبقى بياناتك وطلباتك في الحساب نفسه.</p><button class="google-btn" type="button" data-google-auth="password"><span aria-hidden="true" class="google-g">G</span>المتابعة باستخدام Google</button><p data-auth-message class="auth-message" role="status" aria-live="polite"></p><form id="link-password-form" hidden><p id="link-password-account" class="hint"></p><div class="field"><label for="new-password">كلمة المرور الجديدة</label><div class="password-field"><input id="new-password" name="password" type="password" required minlength="10" autocomplete="new-password"><button type="button" data-toggle-password="new-password" aria-label="إظهار كلمة المرور الجديدة" aria-pressed="false">إظهار</button></div></div><div class="field"><label for="confirm-password">تأكيد كلمة المرور</label><div class="password-field"><input id="confirm-password" name="confirmation" type="password" required minlength="10" autocomplete="new-password"><button type="button" data-toggle-password="confirm-password" aria-label="إظهار تأكيد كلمة المرور" aria-pressed="false">إظهار</button></div></div><button class="auth-submit" type="submit">حفظ كلمة المرور للحساب نفسه</button></form><p class="auth-switch"><a href="forgot-password.html" data-auth-route>نسيت كلمة المرور؟</a></p><p class="auth-switch"><a href="login.html" data-auth-route>العودة لتسجيل الدخول</a></p></section></main><script type="module" src="auth.js?v=27"></script></body></html>
